<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c46ff"/><stop offset=".5" stop-color="#7a2fe0"/><stop offset="1" stop-color="#ff6a6a"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#6c6c74"/>
    </marker>
  </defs>
  <rect width="960" height="330" rx="24" fill="#f6f6f7"/>

  <!-- iPhone Duo, half folded -->
  <g transform="translate(64 58)">
    <rect x="0" y="0" width="150" height="104" rx="16" fill="#151618"/>
    <rect x="5" y="5" width="140" height="99" rx="12" fill="url(#wall)"/>
    <rect x="26" y="28" width="62" height="40" rx="5" fill="#fbfbfd" opacity=".95"/>
    <rect x="70" y="44" width="62" height="42" rx="5" fill="#1c1c1e"/>
    <path d="M0 104h150l22 50H-22z" fill="#4a4c51"/>
    <path d="M10 112h130l10 22H0z" fill="#1f2023"/>
    <path d="M44 138h62l5 12H39z" fill="#404246"/>
  </g>
  <text x="139" y="246" text-anchor="middle" font-size="17" font-weight="650" fill="#161618">Your iPhone</text>
  <text x="139" y="268" text-anchor="middle" font-size="13" fill="#6c6c74">screen on top,</text>
  <text x="139" y="285" text-anchor="middle" font-size="13" fill="#6c6c74">keyboard + trackpad below</text>

  <!-- The private link -->
  <g transform="translate(480 120)">
    <circle r="40" fill="#fff" stroke="#e3e3e8"/>
    <rect x="-13" y="-4" width="26" height="20" rx="4" fill="#161618"/>
    <path d="M-8-4v-6a8 8 0 0 1 16 0v6" fill="none" stroke="#161618" stroke-width="3.2"/>
  </g>
  <text x="480" y="186" text-anchor="middle" font-size="15" font-weight="650" fill="#161618">Your private Tailscale network</text>
  <text x="480" y="206" text-anchor="middle" font-size="13" fill="#6c6c74">WireGuard + a real HTTPS certificate</text>
  <text x="480" y="224" text-anchor="middle" font-size="13" fill="#6c6c74">nothing on the public internet</text>

  <line x1="408" y1="104" x2="246" y2="104" stroke="#6c6c74" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="714" y1="104" x2="552" y2="104" stroke="#6c6c74" stroke-width="2"/>
  <text x="630" y="92" text-anchor="middle" font-size="13" fill="#3a3a40">the screen, live</text>
  <line x1="246" y1="138" x2="408" y2="138" stroke="#6c6c74" stroke-width="2"/>
  <line x1="552" y1="138" x2="714" y2="138" stroke="#6c6c74" stroke-width="2" marker-end="url(#arr)"/>
  <text x="330" y="162" text-anchor="middle" font-size="13" fill="#3a3a40">keys, clicks, gestures</text>

  <!-- Mac -->
  <g transform="translate(742 58)">
    <rect x="0" y="0" width="160" height="104" rx="9" fill="#0b0b0c"/>
    <rect x="6" y="6" width="148" height="92" rx="5" fill="url(#wall)"/>
    <rect x="26" y="26" width="70" height="44" rx="5" fill="#fbfbfd" opacity=".95"/>
    <rect x="74" y="42" width="66" height="44" rx="5" fill="#1c1c1e"/>
    <path d="M-16 106h192l-6 12a6 6 0 0 1-5.3 3.2H-5.3a6 6 0 0 1-5.3-3.2z" fill="#606267"/>
  </g>
  <text x="822" y="246" text-anchor="middle" font-size="17" font-weight="650" fill="#161618">Your Mac</text>
  <text x="822" y="268" text-anchor="middle" font-size="13" fill="#6c6c74">Duo Mac in the menu bar:</text>
  <text x="822" y="285" text-anchor="middle" font-size="13" fill="#6c6c74">shares the screen, takes the input</text>
</svg>
